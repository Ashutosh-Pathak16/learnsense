<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LearnSense — Live Attention Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
      --blue: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px; }
    .container { max-width: 1120px; margin: 0 auto; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 24px; }
    header h1 { font-size: 1.6rem; font-weight: 700; }
    header p { color: var(--muted); font-size: 0.9rem; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    input, button {
      background: var(--card); color: var(--text); border: 1px solid var(--border);
      padding: 8px 12px; border-radius: 8px; font-size: 0.9rem;
    }
    button { background: var(--blue); color: #082f49; font-weight: 600; border: none; cursor: pointer; }
    button:hover { opacity: 0.92; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px;
    }
    .card .label { color: var(--muted); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .card .value { font-size: 2rem; font-weight: 700; margin-top: 6px; }
    .green { color: var(--green); }
    .amber { color: var(--amber); }
    .red { color: var(--red); }
    .blue { color: var(--blue); }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 20px; }
    .panel h2 { font-size: 1.05rem; margin-bottom: 12px; }
    svg { width: 100%; height: 200px; background: #0b1220; border-radius: 8px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; }
    .status-pill { font-size: 0.8rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>LearnSense Live Dashboard</h1>
        <p id="session-info">Session: — | Status: Connecting...</p>
      </div>
      <div class="controls">
        <label for="key-input" class="status-pill">Access Key:</label>
        <input id="key-input" type="password" placeholder="Enter key" style="width: 130px;" />
        <label for="session-input" class="status-pill">Session ID:</label>
        <input id="session-input" type="number" min="1" value="1" style="width: 80px;" />
        <button id="refresh-btn" type="button">Refresh Now</button>
      </div>
    </header>

    <div class="grid">
      <div class="card">
        <div class="label">Attention Score</div>
        <div id="score-val" class="value blue">0.0%</div>
      </div>
      <div class="card">
        <div class="label">Faces Detected</div>
        <div id="total-val" class="value">0</div>
      </div>
      <div class="card">
        <div class="label">Attentive</div>
        <div id="att-val" class="value green">0</div>
      </div>
      <div class="card">
        <div class="label">Distracted</div>
        <div id="dis-val" class="value amber">0</div>
      </div>
      <div class="card">
        <div class="label">Sleeping / Drowsy</div>
        <div id="slp-val" class="value red">0</div>
      </div>
    </div>

    <div class="panel">
      <h2>Attention Score Trend (Recent Samples)</h2>
      <svg id="chart" viewBox="0 0 800 200" preserveAspectRatio="none">
        <line x1="0" y1="50" x2="800" y2="50" stroke="#1e293b" stroke-dasharray="4" />
        <line x1="0" y1="100" x2="800" y2="100" stroke="#1e293b" stroke-dasharray="4" />
        <line x1="0" y1="150" x2="800" y2="150" stroke="#1e293b" stroke-dasharray="4" />
        <polyline id="trend-line" fill="none" stroke="#38bdf8" stroke-width="3" points="" />
      </svg>
    </div>

    <div class="panel">
      <h2>Recent Metric Logs</h2>
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Session</th>
            <th>Faces</th>
            <th>Attentive</th>
            <th>Distracted</th>
            <th>Sleeping</th>
            <th>Score</th>
          </tr>
        </thead>
        <tbody id="logs-body">
          <tr><td colspan="7" style="color: var(--muted);">Waiting for metric logs...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const API_BASE = "https://learnsense.onrender.com";
    const keyInput = document.getElementById("key-input");
    const sessionInput = document.getElementById("session-input");
    const refreshBtn = document.getElementById("refresh-btn");

    keyInput.value = sessionStorage.getItem("learnsense_key") || "";
    keyInput.addEventListener("change", () => {
      sessionStorage.setItem("learnsense_key", keyInput.value.trim());
      pollDashboard();
    });

    function authHeaders() {
      const key = keyInput.value.trim();
      return key ? { "X-Train-Key": key } : {};
    }

    function renderChart(logs) {
      const line = document.getElementById("trend-line");
      if (!logs || logs.length === 0) {
        line.setAttribute("points", "");
        return;
      }
      const w = 800, h = 200, pad = 16;
      const pts = logs.map((row, idx) => {
        const x = logs.length === 1 ? w / 2 : pad + (idx / (logs.length - 1)) * (w - 2 * pad);
        const score = Math.max(0, Math.min(100, Number(row.avg_attention_score || 0)));
        const y = h - pad - (score / 100) * (h - 2 * pad);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });
      line.setAttribute("points", pts.join(" "));
    }

    function renderTable(logs) {
      const tbody = document.getElementById("logs-body");
      if (!logs || logs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="color: var(--muted);">No logs recorded yet.</td></tr>`;
        return;
      }
      const newestFirst = [...logs].reverse().slice(0, 12);
      tbody.innerHTML = newestFirst.map(row => {
        const timeStr = new Date(row.recorded_at).toLocaleTimeString();
        return `
          <tr>
            <td>${timeStr}</td>
            <td>#${row.session_id}</td>
            <td>${row.total_faces}</td>
            <td class="green">${row.attentive_count}</td>
            <td class="amber">${row.distracted_count}</td>
            <td class="red">${row.sleeping_count}</td>
            <td><strong>${Number(row.avg_attention_score).toFixed(1)}%</strong></td>
          </tr>
        `;
      }).join("");
    }

    async function pollDashboard() {
      const sid = parseInt(sessionInput.value, 10) || 1;
      try {
        const headers = authHeaders();
        const latestRes = await fetch(`${API_BASE}/api/metrics/latest?limit=25`, { headers });
        if (!latestRes.ok) throw new Error(`HTTP ${latestRes.status}`);
        const latestLogs = await latestRes.json();

        const filtered = latestLogs.filter(r => r.session_id === sid);
        const activeSeries = filtered.length > 0 ? filtered : latestLogs;

        if (activeSeries.length > 0) {
          const latest = activeSeries[activeSeries.length - 1];
          document.getElementById("score-val").textContent = `${Number(latest.avg_attention_score).toFixed(1)}%`;
          document.getElementById("total-val").textContent = latest.total_faces;
          document.getElementById("att-val").textContent = latest.attentive_count;
          document.getElementById("dis-val").textContent = latest.distracted_count;
          document.getElementById("slp-val").textContent = latest.sleeping_count;
        }

        renderChart(activeSeries);
        renderTable(activeSeries);

        let sessionLabel = `Session #${sid}`;
        try {
          const sumRes = await fetch(`${API_BASE}/api/sessions/${sid}/summary`, { headers });
          if (sumRes.ok) {
            const sum = await sumRes.json();
            sessionLabel = `Session #${sum.session_id} (${sum.subject_name}) — Avg: ${Number(sum.avg_attention_score).toFixed(1)}%`;
          }
        } catch (_) {}

        document.getElementById("session-info").textContent = `${sessionLabel} | Status: Live`;
      } catch (err) {
        document.getElementById("session-info").textContent = `Session #${sid} | Status: Disconnected (${err.message})`;
      }
    }

    refreshBtn.addEventListener("click", pollDashboard);
    sessionInput.addEventListener("change", pollDashboard);
    pollDashboard();
    setInterval(pollDashboard, 1500);
  </script>
</body>
</html>
